<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hexapodus Karlsruhae AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>body { margin: 0; }</style>

  <script>
  // ------------------------------------------------------------------
  // Overlay for the hand-drawn mural: only the cube and the cylinders
  // are added. Settings via URL:  ?fog=0  ?gaze=0  ?shadow=0
  // ------------------------------------------------------------------
  const P = new URLSearchParams(location.search);
  const FOG    = P.get('fog') !== '0';
  const GAZE   = P.get('gaze') !== '0';
  const SHADOW = P.get('shadow') !== '0';

  // Real size of the drawn sheet (metres). HEIGHT/WIDTH must match the photo
  // used for targets.mind (drawing_target.jpg: 1059 x 920 px -> 0.869).
  const MURAL = { width: 1.00, height: 0.869, bottom: 1.10 };
  const SAND_Y = 1.10;            // ground level in the model (m), = sheet bottom

  // ---- Fine-tuning (no Blender needed) ------------------------------------------
  const LAYOUT = {
    shiftUp: 0.20,         // m: everything appears this much higher on the sheet (seen from 1.30 m)
    cylinderSpread: 0.60,  // 1 = original positions, smaller = cylinders closer to the cube
  };
  const VIEW_DIST = 1.30;  // design viewing distance (m), used to convert shiftUp per depth

  // Invisible frame around the sheet: AR objects are only visible "through" the drawing
  AFRAME.registerComponent('portal-mask', {
    init() {
      const h = MURAL.height / MURAL.width;           // image units: width = 1
      const shape = new THREE.Shape();
      shape.moveTo(-6, -6); shape.lineTo(6, -6); shape.lineTo(6, 6); shape.lineTo(-6, 6);
      const hole = new THREE.Path();
      hole.moveTo(-0.5, -h / 2); hole.lineTo(-0.5, h / 2); hole.lineTo(0.5, h / 2); hole.lineTo(0.5, -h / 2);
      shape.holes.push(hole);
      const mask = new THREE.Mesh(new THREE.ShapeGeometry(shape),
                                  new THREE.MeshBasicMaterial({ colorWrite: false }));
      mask.position.z = 0.001;
      mask.renderOrder = -1;
      this.el.object3D.add(mask);
    }
  });

  AFRAME.registerComponent('aquarium', {
    init() {
      // Model is in metres with the sheet bottom at 1.10 m:
      // centre the sheet on the image, 1 image unit = sheet width
      const s = 1 / MURAL.width;
      this.el.object3D.scale.set(s, s, s);
      this.el.object3D.position.set(0, -(MURAL.bottom + MURAL.height / 2) * s, 0);

      this.mixer = null;
      this.gaze = null;
      this.camPos = new THREE.Vector3();
      this.q0 = new THREE.Quaternion();
      this.qt = new THREE.Quaternion();
      this.el.addEventListener('model-loaded', () => this.setup());
    },

    setup() {
      const model = this.el.getObject3D('mesh');
      const env = this.makeEnvMap(this.el.sceneEl.renderer);
      this.model = model;
      const patched = new WeakSet();
      const casters = [];
      this.haze = {
        uRootInv:   { value: new THREE.Matrix4() },
        uHazeColor: { value: new THREE.Color(0x1d5f66) },
        uHazeAmt:   { value: 0.35 },   // max tint for the rearmost cylinders
        uHazeDepth: { value: 3.0 },    // metres behind the wall until max tint
      };

      this.applyLayout(model);

      model.traverse(o => {
        if (o.name.startsWith('Head_Gaze')) this.gaze = o;
        if (!o.isMesh) return;
        if (o.name === 'Cube_Body' || o.name.startsWith('Cylinder_')) casters.push(o);
        const m = o.material;
        if (m && m.isMeshStandardMaterial) {
          m.envMap = env;                 // reflections so metal doesn't look black
          m.envMapIntensity = 1.0;
          if (FOG && !patched.has(m)) { this.addHaze(m); patched.add(m); }
          m.needsUpdate = true;
        }
      });

      if (SHADOW) this.addContactShadows(model, casters);

      // Animation: one 10 s loop; gaze is computed live, so drop its baked track
      const clips = model.animations || [];
      if (clips.length) {
        this.mixer = new THREE.AnimationMixer(model);
        clips.forEach(clip => {
          clip.tracks = clip.tracks.filter(t => !t.name.startsWith('Head_Gaze'));
          if (!clip.tracks.length) return;
          const t0 = clip.tracks[0].times[0];
          clip.tracks.forEach(t => t.shift(-t0));
          clip.resetDuration();
          this.mixer.clipAction(clip).play();
        });
      }
    },

    applyLayout(model) {
      // Raise each object so it appears LAYOUT.shiftUp higher on the sheet: an object d metres
      // behind the wall must move (VIEW_DIST + d) / VIEW_DIST times as much in 3D.
      const lift = o => LAYOUT.shiftUp * (VIEW_DIST + Math.max(0, -o.position.z)) / VIEW_DIST;
      const cube = model.getObjectByName('Cube_Body');
      const cubeX = cube ? cube.position.x : 0;
      model.children.forEach(o => {
        if (o.name.startsWith('Cylinder_')) {
          o.position.x = cubeX + (o.position.x - cubeX) * LAYOUT.cylinderSpread;
        }
        if (o.name === 'Cube_Body' || o.name.startsWith('Cylinder_')) {
          o.userData.lift = lift(o);
          o.position.y += o.userData.lift;
        }
      });
      // The head is animated (position track), so its track values are raised instead
      const headLift = cube ? cube.userData.lift : 0;
      (model.animations || []).forEach(clip => clip.tracks.forEach(t => {
        if (t.name.startsWith('Head_Base') && t.name.endsWith('.position')) {
          for (let i = 1; i < t.values.length; i += 3) t.values[i] += headLift;
        }
      }));
    },

    addContactShadows(model, casters) {
      // Soft dark blobs on the drawn sand under each object
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0.0, 'rgba(0,0,0,0.55)');
      grd.addColorStop(0.5, 'rgba(0,0,0,0.30)');
      grd.addColorStop(1.0, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
      const mat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false });
      const p = new THREE.Vector3();
      model.updateMatrixWorld(true);
      casters.forEach(o => {
        o.geometry.computeBoundingBox();
        const bb = o.geometry.boundingBox;
        const w = (bb.max.x - bb.min.x) * o.scale.x;
        const size = o.name === 'Cube_Body' ? w * 1.7 : w * 2.8;
        o.getWorldPosition(p);
        model.worldToLocal(p);
        const blob = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
        blob.rotation.x = -Math.PI / 2;
        blob.position.set(p.x, SAND_Y + (o.userData.lift || 0) + 0.002, p.z);
        blob.renderOrder = 1;
        model.add(blob);
      });
    },

    addHaze(m) {
      // Blue-green tint by distance behind the wall (model space) - independent of MindAR's units
      const H = this.haze;
      m.onBeforeCompile = (sh) => {
        Object.assign(sh.uniforms, H);
        sh.vertexShader = sh.vertexShader
          .replace('#include <common>',
            '#include <common>\nuniform mat4 uRootInv;\nvarying float vHazeZ;')
          .replace('#include <project_vertex>',
            '#include <project_vertex>\nvHazeZ = (uRootInv * modelMatrix * vec4(transformed, 1.0)).z;');
        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>',
            '#include <common>\nuniform vec3 uHazeColor;\nuniform float uHazeAmt;\nuniform float uHazeDepth;\nvarying float vHazeZ;')
          .replace('#include <dithering_fragment>',
            'gl_FragColor.rgb = mix(gl_FragColor.rgb, uHazeColor, uHazeAmt * smoothstep(0.0, uHazeDepth, -vHazeZ));\n#include <dithering_fragment>');
      };
      m.customProgramCacheKey = () => 'aquarium-haze';
    },

    makeEnvMap(renderer) {
      // Neutral gradient (bright room above, paper tone, dark floor) as reflection source
      const c = document.createElement('canvas');
      c.width = 4; c.height = 256;
      const g = c.getContext('2d');
      const grd = g.createLinearGradient(0, 0, 0, 256);
      grd.addColorStop(0.0, '#ffffff');
      grd.addColorStop(0.45, '#c9bba0');
      grd.addColorStop(1.0, '#2a2620');
      g.fillStyle = grd; g.fillRect(0, 0, 4, 256);
      const tex = new THREE.CanvasTexture(c);
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      const envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16),
        new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide })));
      const pmrem = new THREE.PMREMGenerator(renderer);
      const rt = pmrem.fromScene(envScene, 0.04);
      pmrem.dispose();
      return rt.texture;
    },

    tick(t, dt) {
      if (this.mixer) this.mixer.update(Math.min(dt || 0, 100) / 1000);
      if (this.haze && this.model) this.haze.uRootInv.value.copy(this.model.matrixWorld).invert();
      const q = this.gaze && this.gaze.quaternion;
      const tracked = this.el.parentNode.object3D.visible &&
                      this.model && this.model.matrixWorld.determinant() !== 0;
      if (GAZE && this.gaze && tracked) {
        // Head turns smoothly towards the phone camera (= the viewer's eyes).
        // Only while the image is tracked: before that MindAR's matrix is empty -> NaN.
        this.el.sceneEl.camera.getWorldPosition(this.camPos);
        this.q0.copy(q);
        this.gaze.lookAt(this.camPos);
        this.qt.copy(q);
        if (Number.isFinite(this.qt.x + this.qt.y + this.qt.z + this.qt.w)) {
          q.copy(this.q0).slerp(this.qt, 0.12);
        } else {
          q.copy(this.q0);
        }
      }
      if (q && !Number.isFinite(q.x + q.y + q.z + q.w)) q.identity();   // safety net
    }
  });
  </script>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.01"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
           renderer="colorManagement: true">
    <a-assets>
      <a-asset-item id="aq" src="aquarium.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="0.6" color="#fff6e8"></a-light>
    <a-light type="directional" position="0.5 3 2" intensity="1.0" color="#ffffff"></a-light>

    <a-entity mindar-image-target="targetIndex: 0" portal-mask>
      <a-entity gltf-model="#aq" aquarium></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
